# Erlangly with Docker Compose: the same container `erlangly install` runs.
# Erlangly is licensed under its licence agreement: https://erlangly.com/eula (by installing it you accept it).
#
#   docker compose up -d                 then open the setup link from (it creates the first admin;
#                                        then Erlangly asks you to activate the free plan, a trial or your key):
#   docker compose exec erlangly sh -c 'echo "/first_run/new?token=$(cat storage/setup_token)"' 
#   docker compose pull && docker compose up -d     to upgrade
#   docker compose exec erlangly bin/wfm reset-link you@example.com   locked out? a password reset link's path, to open on your address
#
# The `erlangly` command adds safer upgrades (automatic rollback), backups and restores; with
# Compose, back up with `docker compose exec erlangly bin/backup > erlangly.tar.gz`.
services:
  erlangly:
    # To run exactly the image we built, pin its digest from https://get.erlangly.com/images:
    #   image: ghcr.io/erlangly/erlangly@sha256:…
    image: ghcr.io/erlangly/erlangly:latest
    restart: unless-stopped
    ports:
      - "80:80"
      # - "443:443"                 # with TLS_DOMAIN below
    # environment:
    #   TLS_DOMAIN: wfm.example.com  # HTTPS with a Let's Encrypt certificate for this domain
    #   BEHIND_HTTPS_PROXY: "1"      # or: your own HTTPS proxy is in front (see erlangly.com/docs/install)
    #   TRUSTED_PROXIES: "192.168.1.10"  # and, if that proxy runs on another machine, its address
    #   ERLANGLY_DAILY_BACKUPS: "7"   # nightly backups kept in the volume: one a day for this many days
    #   ERLANGLY_WEEKLY_BACKUPS: "4"  # then one a week for this many weeks before those
    #   (behind your own proxy, publish the port for it alone, like "127.0.0.1:8095:80", on Docker's usual network)
    volumes:
      - erlangly:/rails/storage
    # Docker keeps a container's log forever by default, until it fills the disk: keep the newest 100 MB.
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: "5"

volumes:
  erlangly:
