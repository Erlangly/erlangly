# Erlangly with Docker Compose: the same container `erlangly install` runs.
#
#   docker compose up -d                 then open the setup link from:
#   docker compose exec erlangly sh -c 'echo "/first_run/new?token=$(cat storage/setup_token)"' 
#   docker compose pull && docker compose up -d     to upgrade
#   docker compose exec erlangly bin/wfm reset-link you@example.com   locked out? a password reset link's path, to open on your address
#
# The `erlangly` command adds safer upgrades (automatic rollback), backups and restores; with
# Compose, back up with `docker compose exec erlangly bin/backup > erlangly.tar.gz`.
services:
  erlangly:
    # To run exactly the image we built, pin its digest from https://get.erlangly.com/images:
    #   image: ghcr.io/erlangly/erlangly@sha256:…
    image: ghcr.io/erlangly/erlangly:latest
    restart: unless-stopped
    ports:
      - "80:80"
      # - "443:443"                 # with TLS_DOMAIN below
    # environment:
    #   TLS_DOMAIN: wfm.example.com  # HTTPS with a Let's Encrypt certificate for this domain
    volumes:
      - erlangly:/rails/storage

volumes:
  erlangly:
